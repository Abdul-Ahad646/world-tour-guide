<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#04303a"/><stop offset=".55" stop-color="#0b5d6b"/><stop offset="1" stop-color="#0f7d8c"/>
  </linearGradient>
  <radialGradient id="sunG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff3c4"/><stop offset=".55" stop-color="#ffd166"/><stop offset="1" stop-color="#fb923c"/>
  </radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffd166" stop-opacity=".6"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="falls" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eafcff"/><stop offset=".45" stop-color="#a5e8f5"/><stop offset="1" stop-color="#4fc3d8"/>
  </linearGradient>
  <linearGradient id="gemA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#f59e0b"/>
  </linearGradient>
  <linearGradient id="gemB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#d97706"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  <clipPath id="fallsClip"><path d="M446,268 C452,320 440,380 448,438 L506,438 C498,378 510,322 500,268 Z"/></clipPath>
  <g id="pine">
    <rect x="-3.5" y="26" width="7" height="14" fill="#5b3a1e"/>
    <path d="M0,-44 L17,-12 L-17,-12 Z" fill="#12b886"/>
    <path d="M0,-44 L17,-12 L0,-12 Z" fill="#0a8f68"/>
    <path d="M0,-22 L22,8 L-22,8 Z" fill="#0da678"/>
    <path d="M0,-22 L22,8 L0,8 Z" fill="#087f5b"/>
    <path d="M0,0 L26,34 L-26,34 Z" fill="#0b9668"/>
    <path d="M0,0 L26,34 L0,34 Z" fill="#076e4c"/>
  </g>
</defs>
<style>.cd{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drift{from{transform:translateX(var(--f))}to{transform:translateX(var(--t))}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5.5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.94)}to{transform:scale(1.08)}}
.shimmer{animation:shimmer 2.2s ease-in-out infinite alternate}
@keyframes shimmer{from{opacity:.5}to{opacity:.95}}
.fallband{animation:fallsmove 2.8s linear infinite}
@keyframes fallsmove{from{transform:translateY(-120px)}to{transform:translateY(0)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.9s ease-in-out infinite alternate}
@keyframes twinkle{from{transform:scale(.55);opacity:.35}to{transform:scale(1.15);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1600" height="520" fill="url(#sky)"/>
<!-- sun -->
<g class="pulse"><circle cx="205" cy="102" r="105" fill="url(#glow)"/></g>
<circle cx="205" cy="102" r="52" fill="url(#sunG)"/>
<circle cx="188" cy="84" r="14" fill="#fff7d6" opacity=".85"/>
<!-- birds -->
<g stroke="#05303b" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".75">
  <path d="M598,96 q11,-10 22,0 q11,-10 22,0"/>
  <path d="M692,66 q8,-8 17,0 q8,-8 17,0"/>
  <path d="M1050,120 q9,-9 19,0 q9,-9 19,0"/>
</g>
<!-- clouds -->
<g class="cd" style="--f:-620px;--t:1500px;animation-duration:100s;animation-delay:-45s">
  <ellipse cx="368" cy="66" rx="62" ry="17" fill="#04222a" opacity=".16" filter="url(#soft)"/>
  <g fill="#ffffff" opacity=".8"><ellipse cx="360" cy="58" rx="54" ry="17"/><ellipse cx="390" cy="50" rx="30" ry="12"/></g>
</g>
<g class="cd" style="--f:-1420px;--t:720px;animation-duration:115s;animation-delay:-80s">
  <ellipse cx="1162" cy="146" rx="54" ry="15" fill="#04222a" opacity=".15" filter="url(#soft)"/>
  <g fill="#ffffff" opacity=".72"><ellipse cx="1155" cy="139" rx="47" ry="14"/><ellipse cx="1182" cy="132" rx="26" ry="10"/></g>
</g>
<!-- far mountains -->
<path d="M0,330 L150,208 L262,292 L392,182 L520,300 L655,212 L790,318 L905,238 L1035,330 L1160,222 L1290,312 L1420,232 L1600,330 L1600,520 L0,520 Z" fill="#0f7d8c"/>
<g fill="#ffffff" opacity=".92">
  <path d="M392,182 L430,222 L410,236 L394,216 L376,234 L356,218 Z"/>
  <path d="M1160,222 L1194,258 L1176,270 L1161,252 L1145,268 L1130,254 Z"/>
  <path d="M150,208 L180,240 L164,252 L150,236 L136,250 L122,238 Z"/>
</g>
<path d="M392,182 L520,300 L655,212 L520,300 Z" fill="#0a5a68" opacity=".35"/>
<!-- mid mountains -->
<path d="M0,398 L170,286 L330,382 L470,268 L640,396 L820,300 L990,404 L1150,306 L1330,398 L1470,322 L1600,392 L1600,520 L0,520 Z" fill="#0a5a68"/>
<path d="M470,268 L640,396 L560,396 L470,300 Z" fill="#07424e" opacity=".5"/>
<path d="M1150,306 L1330,398 L1240,398 L1150,330 Z" fill="#07424e" opacity=".45"/>
<!-- waterfall -->
<g>
  <path d="M446,268 C452,320 440,380 448,438 L506,438 C498,378 510,322 500,268 Z" fill="url(#falls)"/>
  <g clip-path="url(#fallsClip)"><g class="fallband" fill="#ffffff">
    <rect x="438" y="60" width="80" height="30" rx="15" opacity=".3" filter="url(#soft)"/>
    <rect x="438" y="180" width="80" height="30" rx="15" opacity=".3" filter="url(#soft)"/>
    <rect x="438" y="300" width="80" height="30" rx="15" opacity=".3" filter="url(#soft)"/>
    <rect x="438" y="420" width="80" height="30" rx="15" opacity=".3" filter="url(#soft)"/>
    <rect x="438" y="540" width="80" height="30" rx="15" opacity=".3" filter="url(#soft)"/>
  </g></g>
  <g class="shimmer">
  <path d="M466,272 C470,326 464,382 468,434" stroke="#ffffff" stroke-width="7" fill="none" opacity=".75" stroke-linecap="round"/>
  <path d="M490,272 C494,322 490,378 492,432" stroke="#eafcff" stroke-width="4.5" fill="none" opacity=".6" stroke-linecap="round"/>
  <path d="M428,300 C434,346 430,392 434,430" stroke="#a5e8f5" stroke-width="6" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M520,310 C524,352 522,394 524,428" stroke="#a5e8f5" stroke-width="5" fill="none" opacity=".5" stroke-linecap="round"/>
  </g>
  <ellipse cx="478" cy="446" rx="118" ry="17" fill="#67e8f9" opacity=".5"/>
  <ellipse cx="478" cy="442" rx="80" ry="11" fill="#a5f3fc" opacity=".65"/>
  <g fill="#ffffff">
    <circle cx="440" cy="434" r="13" opacity=".92"/><circle cx="466" cy="428" r="17" opacity=".95"/>
    <circle cx="496" cy="432" r="14" opacity=".92"/><circle cx="518" cy="438" r="10" opacity=".85"/>
    <circle cx="452" cy="420" r="9" opacity=".85"/><circle cx="505" cy="419" r="8" opacity=".8"/>
  </g>
  <ellipse cx="478" cy="424" rx="86" ry="20" fill="#ffffff" opacity=".38" filter="url(#soft)"/>
</g>
<!-- front ridge -->
<path d="M0,520 L0,428 C180,398 340,430 520,452 C760,480 900,440 1100,452 C1300,464 1450,436 1600,452 L1600,520 Z" fill="#06333d"/>
<path d="M0,428 C180,398 340,430 520,452" fill="none" stroke="#12b886" stroke-width="3" opacity=".35"/>
<!-- pines -->
<use href="#pine" transform="translate(120,408) scale(1.15)"/>
<use href="#pine" transform="translate(196,428) scale(.85)"/>
<use href="#pine" transform="translate(1052,424) scale(.95)"/>
<use href="#pine" transform="translate(1120,442) scale(.7)"/>
<use href="#pine" transform="translate(1488,420) scale(1.05)"/>
<use href="#pine" transform="translate(1420,444) scale(.72)"/>
<use href="#pine" transform="translate(300,446) scale(.66)"/>
<!-- glowing gem -->
<g transform="translate(1300,382)">
  <circle cx="0" cy="-6" r="98" fill="url(#glow)"/>
  <ellipse cx="2" cy="58" rx="62" ry="10" fill="#02181d" opacity=".5" filter="url(#soft)"/>
  <path d="M0,-58 L44,-24 L30,44 L0,62 L-30,44 L-44,-24 Z" fill="url(#gemB)"/>
  <path d="M0,-58 L44,-24 L0,-12 L-44,-24 Z" fill="url(#gemA)"/>
  <path d="M0,-12 L30,44 L0,62 Z" fill="#fbbf24" opacity=".85"/>
  <path d="M0,-12 L-30,44 L0,62 Z" fill="#d97706" opacity=".65"/>
  <path d="M0,-58 L0,-12 M-44,-24 L0,-12 L44,-24 M-30,44 L0,-12 L30,44" stroke="#fff7d6" stroke-width="2.4" fill="none" opacity=".8"/>
  <ellipse cx="-16" cy="-34" rx="11" ry="6" fill="#ffffff" opacity=".9" transform="rotate(-26 -16 -34)"/>
  <g fill="#ffd166">
    <g class="twinkle"><path d="M-66,-52 l3.4,9 9,3.4 -9,3.4 -3.4,9 -3.4,-9 -9,-3.4 9,-3.4 Z"/></g>
    <g class="twinkle" style="animation-delay:-.7s;animation-duration:1.6s"><path d="M64,-30 l2.8,7.4 7.4,2.8 -7.4,2.8 -2.8,7.4 -2.8,-7.4 -7.4,-2.8 7.4,-2.8 Z"/></g>
    <g class="twinkle" style="animation-delay:-1.2s;animation-duration:2.2s"><path d="M52,40 l2.2,5.8 5.8,2.2 -5.8,2.2 -2.2,5.8 -2.2,-5.8 -5.8,-2.2 5.8,-2.2 Z"/></g>
  </g>
</g>
<!-- sparkles -->
<g fill="#ffffff">
  <path d="M880,180 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z" opacity=".8"/>
  <path d="M240,250 l2.6,6.8 6.8,2.6 -6.8,2.6 -2.6,6.8 -2.6,-6.8 -6.8,-2.6 6.8,-2.6 Z" opacity=".65"/>
</g>
</svg>
