<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#052730"/><stop offset=".55" stop-color="#0b5d6b"/><stop offset="1" stop-color="#0e7490"/>
  </linearGradient>
  <radialGradient id="sea" cx=".35" cy=".3" r=".85">
    <stop offset="0" stop-color="#8fe8d4"/><stop offset=".35" stop-color="#2bbfa8"/>
    <stop offset=".7" stop-color="#0e8a9c"/><stop offset="1" stop-color="#065a68"/>
  </radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffd166" stop-opacity=".5"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pinO" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/>
  </linearGradient>
  <linearGradient id="pinT" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#0b7285"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  <g id="pin">
    <path d="M0,0 C-25,-28 -33,-42 -33,-60 a33,33 0 1,1 66,0 C33,-42 25,-28 0,0 Z"/>
    <circle cx="0" cy="-62" r="14.5" fill="#ffffff"/>
    <circle cx="0" cy="-62" r="7.5" fill="#0b5d6b"/>
    <ellipse cx="-13" cy="-76" rx="9" ry="6" fill="#ffffff" opacity=".45" transform="rotate(-24 -13 -76)"/>
  </g>
</defs>
<style>.bob{animation:bob 2.4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.flow{animation:dashmove 7s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-560px}}
.orbit{transform-box:view-box;transform-origin:1215px 252px;animation:spin 85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1600" height="520" fill="url(#sky)"/>
<g fill="#ffffff">
  <circle cx="180" cy="70" r="3" opacity=".6"/><circle cx="640" cy="46" r="2.4" opacity=".5"/>
  <circle cx="905" cy="90" r="2.6" opacity=".5"/><circle cx="1520" cy="70" r="2.6" opacity=".55"/>
  <circle cx="420" cy="130" r="2" opacity=".4"/><circle cx="80" cy="230" r="2.2" opacity=".4"/>
  <circle cx="1560" cy="300" r="2.2" opacity=".4"/>
</g>
<!-- orbit ring -->
<g class="orbit">
<ellipse cx="1215" cy="252" rx="308" ry="98" fill="none" stroke="#ffd166" stroke-width="3.5" opacity=".45" transform="rotate(-16 1215 252)"/>
<circle cx="942" cy="322" r="9" fill="#ffd166" opacity=".9"/>
<circle cx="942" cy="322" r="4" fill="#fff3c4"/>
</g>
<!-- globe shadow + body -->
<ellipse cx="1215" cy="468" rx="185" ry="16" fill="#03222a" opacity=".45" filter="url(#soft)"/>
<circle cx="1215" cy="252" r="178" fill="url(#sea)"/>
<g fill="#a7f3d0" opacity=".92">
  <path d="M1090,150 C1120,128 1168,132 1178,158 C1186,180 1162,196 1136,192 C1106,188 1068,172 1090,150 Z"/>
  <path d="M1122,214 C1150,202 1180,216 1178,242 C1176,268 1148,286 1126,272 C1104,258 1098,226 1122,214 Z"/>
  <path d="M1236,138 C1276,124 1330,140 1334,168 C1337,192 1302,204 1272,196 C1240,188 1204,152 1236,138 Z"/>
  <path d="M1268,238 C1312,226 1352,248 1346,282 C1340,312 1296,322 1270,300 C1248,281 1238,250 1268,238 Z"/>
  <path d="M1062,300 C1084,288 1110,298 1108,318 C1106,336 1082,344 1066,332 C1052,322 1048,308 1062,300 Z"/>
  <path d="M1318,330 C1342,322 1364,334 1360,352 C1356,368 1332,372 1320,360 C1308,349 1302,338 1318,330 Z"/>
</g>
<g fill="none" stroke="#ffffff" opacity=".22" stroke-width="2">
  <ellipse cx="1215" cy="252" rx="86" ry="178"/>
  <ellipse cx="1215" cy="252" rx="152" ry="178"/>
  <path d="M1043,196 C1140,224 1290,224 1387,196"/>
  <path d="M1039,252 C1140,252 1290,252 1391,252"/>
  <path d="M1043,308 C1140,280 1290,280 1387,308"/>
</g>
<ellipse cx="1148" cy="152" rx="72" ry="42" fill="#ffffff" opacity=".32" filter="url(#soft)" transform="rotate(-28 1148 152)"/>
<circle cx="1215" cy="252" r="178" fill="none" stroke="#0a4552" stroke-width="3" opacity=".35"/>
<!-- pins on globe -->
<g class="bob"><use href="#pin" transform="translate(1152,196) scale(1.05)" fill="url(#pinO)"/></g>
<g class="bob" style="animation-delay:-1.2s"><use href="#pin" transform="translate(1306,300) scale(.8)" fill="url(#pinO)"/></g>
<g class="bob" style="animation-delay:-.8s"><use href="#pin" transform="translate(1252,140) scale(.62)" fill="#ffd166"/></g>
<!-- dashed route across sky -->
<path d="M180,300 C360,180 560,300 760,190 C860,138 950,150 1035,205" class="flow" fill="none" stroke="#ffd166" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="2 14" opacity=".8"/>
<!-- left mini globe -->
<ellipse cx="315" cy="392" rx="86" ry="11" fill="#03222a" opacity=".4" filter="url(#soft)"/>
<circle cx="315" cy="318" r="66" fill="url(#sea)"/>
<g fill="#a7f3d0" opacity=".92">
  <path d="M272,272 C292,260 318,264 320,280 C322,294 300,302 284,296 C266,289 256,282 272,272 Z"/>
  <path d="M292,318 C312,310 332,320 330,338 C328,354 306,360 292,348 C280,337 276,326 292,318 Z"/>
  <path d="M338,282 C354,276 368,286 364,298 C360,308 344,310 336,300 C330,291 328,287 338,282 Z"/>
</g>
<ellipse cx="290" cy="282" rx="26" ry="15" fill="#ffffff" opacity=".32" filter="url(#soft)" transform="rotate(-28 290 282)"/>
<!-- left pins -->
<g class="bob" style="animation-delay:-.2s"><use href="#pin" transform="translate(180,302) scale(1.25)" fill="url(#pinO)"/></g>
<ellipse cx="180" cy="310" rx="30" ry="6" fill="#03222a" opacity=".35" filter="url(#soft3)"/>
<g class="bob" style="animation-delay:-1.6s"><use href="#pin" transform="translate(468,238) scale(.95)" fill="url(#pinT)"/></g>
<g class="bob" style="animation-delay:-1s"><use href="#pin" transform="translate(760,192) scale(.7)" fill="url(#pinO)"/></g>
<!-- bottom hills -->
<path d="M0,452 C280,424 560,458 860,442 C1150,428 1360,458 1600,438 L1600,520 L0,520 Z" fill="#0b5563"/>
<path d="M0,486 C320,462 700,492 1020,478 C1260,468 1440,490 1600,478 L1600,520 L0,520 Z" fill="#073a44"/>
<!-- sparkles -->
<g fill="#ffd166">
  <path d="M560,330 l4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4 Z"/>
  <path d="M1468,120 l3.4,9 9,3.4 -9,3.4 -3.4,9 -3.4,-9 -9,-3.4 9,-3.4 Z" opacity=".9"/>
  <path d="M120,420 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z" opacity=".8"/>
</g>
<circle cx="1215" cy="252" r="215" fill="url(#glow)" opacity=".35"/>
</svg>
