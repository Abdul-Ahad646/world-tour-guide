<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#052730"/><stop offset=".55" stop-color="#0b5d6b"/><stop offset="1" stop-color="#0e7490"/>
  </linearGradient>
  <radialGradient id="face" cx=".42" cy=".38" r=".8">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#fdf3da"/><stop offset="1" stop-color="#ecd9ac"/>
  </radialGradient>
  <radialGradient id="ring" cx=".38" cy=".34" r=".85">
    <stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#0e8a9c"/><stop offset="1" stop-color="#065a68"/>
  </radialGradient>
  <linearGradient id="pinO" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/>
  </linearGradient>
  <linearGradient id="pinG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6ee7a0"/><stop offset=".55" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>.cd{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drift{from{transform:translateX(var(--f))}to{transform:translateX(var(--t))}}
.bounce{animation:bounce 2.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.flow{animation:dashmove 9s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-560px}}
.needle{transform-box:fill-box;transform-origin:center;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1600" height="520" fill="url(#sky)"/>
<g fill="#ffffff">
  <circle cx="420" cy="52" r="2.6" opacity=".5"/><circle cx="1020" cy="60" r="2.4" opacity=".5"/>
  <circle cx="1500" cy="120" r="2.6" opacity=".5"/><circle cx="90" cy="120" r="2.2" opacity=".45"/>
  <circle cx="760" cy="110" r="2" opacity=".4"/>
</g>
<g>
  <g class="cd" style="--f:-1700px;--t:420px;animation-duration:115s;animation-delay:-40s">
  <ellipse cx="1436" cy="100" rx="58" ry="17" fill="#04222a" opacity=".18" filter="url(#soft)"/>
  <g fill="#ffffff" opacity=".85">
    <ellipse cx="1428" cy="92" rx="52" ry="17"/><ellipse cx="1458" cy="84" rx="30" ry="12"/>
  </g>
  </g>
  <g class="cd" style="--f:-560px;--t:1560px;animation-duration:90s;animation-delay:-65s">
  <ellipse cx="330" cy="66" rx="52" ry="14" fill="#04222a" opacity=".16" filter="url(#soft)"/>
  <g fill="#ffffff" opacity=".7">
    <ellipse cx="324" cy="59" rx="46" ry="14"/><ellipse cx="350" cy="52" rx="26" ry="10"/>
  </g>
  </g>
</g>
<!-- compass -->
<g transform="translate(215,168)">
  <ellipse cx="6" cy="98" rx="88" ry="14" fill="#03222a" opacity=".4" filter="url(#soft)"/>
  <circle cx="0" cy="0" r="86" fill="#04222a" opacity=".35"/>
  <circle cx="0" cy="-6" r="86" fill="url(#ring)"/>
  <circle cx="0" cy="-6" r="66" fill="url(#face)"/>
  <circle cx="0" cy="-6" r="66" fill="none" stroke="#c9a86a" stroke-width="2.5"/>
  <g stroke="#8aa5ab" stroke-width="3" stroke-linecap="round">
    <path d="M0,-64 L0,-52 M0,40 L0,52 M-58,0 L-46,0 M46,0 L58,0" transform="translate(0,-6)"/>
  </g>
  <g class="needle">
  <path d="M0,-52 L15,-4 L0,4 L-15,-4 Z" fill="#f97316" transform="translate(0,-6)"/>
  <path d="M0,44 L13,-2 L0,6 L-13,-2 Z" fill="#e6f4f6" transform="translate(0,-6)"/>
  <path d="M0,-52 L15,-4 L0,4 Z" fill="#c2410c" opacity=".55" transform="translate(0,-6)"/>
  <circle cx="0" cy="-6" r="10" fill="url(#gold)"/>
  <circle cx="-3" cy="-10" r="3.4" fill="#fff3c4"/>
  </g>
  <ellipse cx="-30" cy="-52" rx="30" ry="14" fill="#ffffff" opacity=".35" filter="url(#soft3)" transform="rotate(-30 -30 -52)"/>
</g>
<!-- folded map shadow -->
<path d="M500,470 L812,398 L1120,452 L1432,382 L1452,420 L1130,492 L812,440 L520,505 Z" fill="#03222a" opacity=".45" filter="url(#soft)"/>
<!-- folded map: thickness -->
<path d="M505,452 L815,382 L815,398 L505,468 Z" fill="#cbb27e"/>
<path d="M815,382 L1122,436 L1122,452 L815,398 Z" fill="#b89b5e"/>
<path d="M1122,436 L1428,368 L1428,384 L1122,452 Z" fill="#cbb27e"/>
<!-- folded map: top panels -->
<path d="M505,452 L815,382 L815,196 L505,266 Z" fill="#fff7e6"/>
<path d="M815,382 L1122,436 L1122,250 L815,196 Z" fill="#fdeec9"/>
<path d="M1122,436 L1428,368 L1428,182 L1122,250 Z" fill="#fff2d5"/>
<!-- map details -->
<g stroke="#d9e4e0" stroke-width="2" opacity=".8">
  <path d="M560,280 L815,222 M560,340 L815,282 M560,400 L815,342" />
  <path d="M880,226 L880,404 M1000,238 L1000,422" stroke="#e7dcc0"/>
  <path d="M1180,262 L1180,420 M1300,236 L1300,398" stroke="#e7dcc0"/>
</g>
<path d="M520,420 C620,360 700,388 800,330 C900,272 1010,330 1120,300 C1230,272 1330,300 1415,262" fill="none" stroke="#38b6c9" stroke-width="13" stroke-linecap="round" opacity=".55"/>
<g fill="#34d399" opacity=".5">
  <ellipse cx="610" cy="300" rx="42" ry="20" transform="rotate(-12 610 300)"/>
  <ellipse cx="985" cy="345" rx="48" ry="22" transform="rotate(8 985 345)"/>
  <ellipse cx="1250" cy="300" rx="40" ry="19" transform="rotate(-6 1250 300)"/>
</g>
<path d="M600,398 C720,330 830,368 940,318 C1040,272 1160,300 1272,262" class="flow" fill="none" stroke="#fb923c" stroke-width="7" stroke-linecap="round" stroke-dasharray="16 12"/>
<!-- X mark -->
<g stroke="#ef4444" stroke-width="9" stroke-linecap="round">
  <path d="M1330,332 L1362,364 M1362,332 L1330,364"/>
</g>
<!-- start pin (green) -->
<g transform="translate(600,398)">
  <ellipse cx="0" cy="4" rx="20" ry="5" fill="#03222a" opacity=".3" filter="url(#soft3)"/>
  <path d="M0,0 C-19,-21 -25,-32 -25,-46 a25,25 0 1,1 50,0 C25,-32 19,-21 0,0 Z" fill="url(#pinG)"/>
  <circle cx="0" cy="-47" r="10.5" fill="#ffffff"/>
  <ellipse cx="-7" cy="-57" rx="6" ry="4" fill="#ffffff" opacity=".5" transform="rotate(-24 -7 -57)"/>
</g>
<!-- destination pin (orange, big) -->
<g transform="translate(1280,268)">
  <ellipse cx="0" cy="6" rx="30" ry="7" fill="#03222a" opacity=".32" filter="url(#soft3)"/>
  <g class="bounce">
  <path d="M0,0 C-27,-30 -35,-45 -35,-65 a35,35 0 1,1 70,0 C35,-45 27,-30 0,0 Z" fill="url(#pinO)"/>
  <circle cx="0" cy="-66" r="15.5" fill="#ffffff"/>
  <circle cx="0" cy="-66" r="8" fill="#0b5d6b"/>
  <ellipse cx="-14" cy="-80" rx="9.5" ry="6" fill="#ffffff" opacity=".45" transform="rotate(-24 -14 -80)"/>
  </g>
</g>
<!-- fold creases -->
<g stroke="#c9b78a" stroke-width="3" opacity=".7">
  <path d="M815,196 L815,382 M1122,250 L1122,436"/>
</g>
<!-- pencil -->
<g transform="translate(268,408) rotate(-28)">
  <ellipse cx="10" cy="34" rx="120" ry="11" fill="#03222a" opacity=".35" filter="url(#soft)"/>
  <rect x="-118" y="-13" width="196" height="27" rx="5" fill="url(#gold)"/>
  <rect x="-118" y="1" width="196" height="13" rx="5" fill="#b45309" opacity=".4"/>
  <path d="M78,-13 L122,0 L78,14 Z" fill="#ffe9c9"/>
  <path d="M106,-4.5 L122,0 L106,4.5 Z" fill="#33424a"/>
  <rect x="-138" y="-13" width="20" height="27" rx="5" fill="#fb7185"/>
  <rect x="-122" y="-13" width="7" height="27" fill="#d7dde1"/>
</g>
<!-- sparkles -->
<g fill="#ffd166">
  <path d="M445,300 l3.4,9 9,3.4 -9,3.4 -3.4,9 -3.4,-9 -9,-3.4 9,-3.4 Z"/>
  <path d="M1490,238 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z" opacity=".85"/>
</g>
</svg>
