<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#052730"/><stop offset=".55" stop-color="#0b5d6b"/><stop offset="1" stop-color="#0e7490"/>
  </linearGradient>
  <radialGradient id="sunG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff3c4"/><stop offset=".55" stop-color="#ffd166"/><stop offset="1" stop-color="#fb923c"/>
  </radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffd166" stop-opacity=".55"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
  </linearGradient>
  <linearGradient id="planeB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e6f4f6"/><stop offset="1" stop-color="#b9d9de"/>
  </linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe3a3"/><stop offset="1" stop-color="#f0b35e"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>.cd{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drift{from{transform:translateX(var(--f))}to{transform:translateX(var(--t))}}
.fly{animation:fly 38s linear infinite}
@keyframes fly{0%{transform:translate(-700px,6px)}25%{transform:translate(-175px,-12px)}50%{transform:translate(350px,4px)}75%{transform:translate(875px,-12px)}100%{transform:translate(1420px,6px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5.5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.94)}to{transform:scale(1.08)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1600" height="520" fill="url(#sky)"/>
<!-- stars -->
<g fill="#ffffff">
  <circle cx="120" cy="60" r="3" opacity=".6"/><circle cx="560" cy="42" r="2.4" opacity=".5"/>
  <circle cx="980" cy="66" r="2.8" opacity=".55"/><circle cx="1470" cy="210" r="2.4" opacity=".45"/>
  <circle cx="700" cy="120" r="2" opacity=".4"/><circle cx="60" cy="180" r="2.2" opacity=".4"/>
  <circle cx="1130" cy="36" r="2.2" opacity=".5"/>
</g>
<!-- sun -->
<g class="pulse"><circle cx="1300" cy="108" r="110" fill="url(#glow)"/></g>
<circle cx="1300" cy="108" r="58" fill="url(#sunG)"/>
<circle cx="1280" cy="88" r="16" fill="#fff7d6" opacity=".8"/>
<!-- clouds -->
<g>
  <g class="cd" style="--f:-480px;--t:1520px;animation-duration:105s;animation-delay:-30s">
  <ellipse cx="262" cy="98" rx="86" ry="24" fill="#04222a" opacity=".22" filter="url(#soft)"/>
  <g fill="#ffffff" opacity=".92">
    <ellipse cx="250" cy="88" rx="70" ry="26"/><ellipse cx="300" cy="76" rx="46" ry="20"/><ellipse cx="205" cy="78" rx="38" ry="16"/>
  </g>
  </g>
  <g class="cd" style="--f:-950px;--t:1050px;animation-duration:95s;animation-delay:-60s">
  <ellipse cx="726" cy="66" rx="60" ry="16" fill="#04222a" opacity=".18" filter="url(#soft)"/>
  <g fill="#ffffff" opacity=".75">
    <ellipse cx="720" cy="58" rx="52" ry="17"/><ellipse cx="756" cy="50" rx="32" ry="13"/>
  </g>
  </g>
  <g class="cd" style="--f:-1750px;--t:350px;animation-duration:120s;animation-delay:-15s">
  <ellipse cx="1476" cy="212" rx="66" ry="18" fill="#04222a" opacity=".2" filter="url(#soft)"/>
  <g fill="#ffffff" opacity=".85">
    <ellipse cx="1468" cy="203" rx="58" ry="19"/><ellipse cx="1504" cy="194" rx="34" ry="14"/>
  </g>
  </g>
</g>
<!-- flight route -->
<path d="M110,168 C420,52 760,215 1085,120 C1250,74 1420,84 1520,60" fill="none" stroke="#ffd166" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="2 14" opacity=".85"/>
<circle cx="110" cy="168" r="7" fill="#ffd166"/><circle cx="1085" cy="120" r="6" fill="#ffd166" opacity=".85"/>
<!-- 3D plane -->
<g class="fly"><g transform="translate(415,118) rotate(-7)">
  <ellipse cx="6" cy="52" rx="105" ry="12" fill="#04222a" opacity=".25" filter="url(#soft)"/>
  <path d="M-98,-12 L-132,-46 L-106,-48 L-74,-16 Z" fill="url(#gold)"/>
  <path d="M-104,-44 L-132,-46 L-106,-48 Z" fill="#fff3c4" opacity=".8"/>
  <path d="M-112,2 Q-120,-15 -96,-20 L38,-27 Q108,-29 128,-9 Q138,2 124,9 L40,17 Q-58,24 -96,15 Q-114,11 -112,2 Z" fill="url(#planeB)"/>
  <path d="M-112,2 Q-58,10 40,8 L124,3 Q130,6 124,9 L40,17 Q-58,24 -96,15 Q-114,11 -112,2 Z" fill="#8fb9c0" opacity=".45"/>
  <path d="M-12,5 L42,46 L68,46 L30,3 Z" fill="url(#gold)"/>
  <path d="M-12,5 L42,46 L52,46 L16,4 Z" fill="#b45309" opacity=".35"/>
  <path d="M-30,-24 L14,-26 L34,2 L6,4 Z" fill="#0e7490" opacity=".85"/>
  <g fill="#0b5d6b">
    <circle cx="58" cy="-12" r="4.6"/><circle cx="76" cy="-11" r="4.6"/><circle cx="94" cy="-9" r="4.6"/><circle cx="40" cy="-13" r="4.6"/>
  </g>
  <ellipse cx="112" cy="-12" rx="12" ry="5" fill="#ffffff" opacity=".85"/>
</g></g>
<!-- layered hills -->
<path d="M0,392 C240,352 430,398 700,378 C980,358 1180,402 1600,368 L1600,520 L0,520 Z" fill="#12707f"/>
<path d="M0,438 C260,404 520,446 820,428 C1120,410 1330,450 1600,424 L1600,520 L0,520 Z" fill="#0b5563"/>
<path d="M0,478 C300,452 620,486 920,470 C1200,456 1400,484 1600,466 L1600,520 L0,520 Z" fill="#073a44"/>
<!-- ground shadows -->
<ellipse cx="300" cy="486" rx="185" ry="13" fill="#03222a" opacity=".4" filter="url(#soft)"/>
<ellipse cx="1308" cy="486" rx="200" ry="13" fill="#03222a" opacity=".4" filter="url(#soft)"/>
<!-- landmarks: left cluster (pyramid + eiffel) -->
<g>
  <path d="M212,318 L118,472 L212,472 Z" fill="#f6c453"/>
  <path d="M212,318 L306,472 L212,472 Z" fill="#dd9a3c"/>
  <path d="M212,318 L196,344 L228,344 Z" fill="#fff0bd"/>
  <path d="M212,344 L150,472 L212,472 Z" fill="#ffffff" opacity=".08"/>
  <g>
    <path d="M392,296 C386,350 372,404 356,470 L376,470 C384,436 390,414 394,398 C398,414 404,436 412,470 L432,470 C416,404 402,350 396,296 Z M366,428 L422,428 L426,444 L362,444 Z M376,378 L412,378 L415,392 L373,392 Z M388,296 L400,296 L402,314 L386,314 Z" fill="url(#sand)"/>
    <path d="M394,296 C400,350 414,404 430,470 L412,470 C404,436 398,414 394,398 Z" fill="#c97e2e" opacity=".55"/>
  </g>
</g>
<!-- landmarks: right cluster (big ben + pagoda + dome) -->
<g>
  <g>
    <rect x="1158" y="336" width="52" height="136" fill="#f0b35e"/>
    <rect x="1184" y="336" width="26" height="136" fill="#cf8a35"/>
    <path d="M1152,336 L1184,282 L1216,336 Z" fill="#0b5d6b"/>
    <path d="M1184,282 L1216,336 L1184,336 Z" fill="#083f4a"/>
    <rect x="1180" y="262" width="8" height="24" fill="#ffd166"/>
    <circle cx="1184" cy="362" r="15" fill="#fff7e6"/>
    <circle cx="1184" cy="362" r="15" fill="none" stroke="#b45309" stroke-width="3"/>
    <path d="M1184,362 L1184,352 M1184,362 L1191,366" stroke="#7c4a03" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <g>
    <path d="M1368,290 L1308,330 L1428,330 Z" fill="#0e7490"/>
    <path d="M1368,290 L1368,330 L1428,330 Z" fill="#0a5563"/>
    <path d="M1368,330 L1322,366 L1414,366 Z" fill="#128a9e"/>
    <path d="M1368,330 L1368,366 L1414,366 Z" fill="#0b6373"/>
    <rect x="1340" y="366" width="56" height="40" fill="#f0b35e"/>
    <rect x="1368" y="366" width="28" height="40" fill="#cf8a35"/>
    <path d="M1368,404 L1314,442 L1422,442 Z" fill="#0e7490"/>
    <path d="M1368,404 L1368,442 L1422,442 Z" fill="#0a5563"/>
    <rect x="1336" y="442" width="64" height="30" fill="#e8a54b"/>
    <rect x="1368" y="442" width="32" height="30" fill="#c07f2c"/>
    <rect x="1362" y="272" width="12" height="20" fill="#ffd166"/>
  </g>
  <g>
    <rect x="1472" y="416" width="96" height="56" fill="#fdf3da"/>
    <rect x="1520" y="416" width="48" height="56" fill="#ecd9ac"/>
    <path d="M1520,356 C1546,382 1558,398 1560,416 L1480,416 C1482,398 1494,382 1520,356 Z" fill="#fdf3da"/>
    <path d="M1520,356 C1546,382 1558,398 1560,416 L1520,416 Z" fill="#ecd9ac"/>
    <rect x="1516" y="336" width="8" height="22" fill="url(#gold)"/>
    <rect x="1460" y="392" width="10" height="80" fill="#fdf3da"/>
    <rect x="1570" y="392" width="10" height="80" fill="#ecd9ac"/>
    <path d="M1465,372 L1452,392 L1478,392 Z M1575,372 L1562,392 L1588,392 Z" fill="#0b5d6b"/>
  </g>
</g>
<!-- sparkles -->
<g fill="#ffd166">
  <path d="M520,238 l4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4 Z"/>
  <path d="M1062,262 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z" opacity=".85"/>
  <path d="M90,300 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z" opacity=".8"/>
</g>
</svg>
