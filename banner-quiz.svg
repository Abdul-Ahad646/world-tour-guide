<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#052730"/><stop offset=".55" stop-color="#0b5d6b"/><stop offset="1" stop-color="#0e7490"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe9a8"/><stop offset=".35" stop-color="#ffd166"/>
    <stop offset=".7" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
  </linearGradient>
  <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f6c453"/><stop offset="1" stop-color="#92600a"/>
  </linearGradient>
  <linearGradient id="qmO" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f97316"/>
  </linearGradient>
  <linearGradient id="qmT" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0e7490"/>
  </linearGradient>
  <radialGradient id="bulb" cx=".38" cy=".32" r=".85">
    <stop offset="0" stop-color="#fffbe8"/><stop offset=".55" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
  </radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffd166" stop-opacity=".55"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  <g id="qm">
    <path d="M-4,-58 a52,52 0 1,1 50,66 C22,20 12,32 12,52 L12,62" fill="none" stroke-width="36" stroke-linecap="round"/>
  </g>
</defs>
<style>.floaty{animation:floaty 3.4s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-12px) rotate(2.5deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5.5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.94)}to{transform:scale(1.08)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1600" height="520" fill="url(#sky)"/>
<!-- confetti + sparkles -->
<g>
  <circle cx="150" cy="80" r="6" fill="#fb923c"/><circle cx="520" cy="52" r="5" fill="#5eead4"/>
  <circle cx="880" cy="70" r="6" fill="#ffd166"/><circle cx="1180" cy="46" r="5" fill="#fb923c"/>
  <circle cx="1520" cy="120" r="6" fill="#5eead4"/><circle cx="690" cy="130" r="4.5" fill="#ffffff" opacity=".7"/>
  <rect x="420" y="120" width="13" height="13" rx="3" fill="#ffd166" transform="rotate(24 426 126)"/>
  <rect x="1010" y="150" width="12" height="12" rx="3" fill="#fb923c" transform="rotate(-18 1016 156)"/>
  <rect x="90" y="220" width="11" height="11" rx="3" fill="#5eead4" transform="rotate(30 95 225)"/>
  <g fill="#ffd166">
    <path d="M610,240 l4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4 Z"/>
    <path d="M1550,300 l3.4,9 9,3.4 -9,3.4 -3.4,9 -3.4,-9 -9,-3.4 9,-3.4 Z" opacity=".9"/>
    <path d="M210,330 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z" opacity=".85"/>
  </g>
</g>
<!-- big question mark, left -->
<g class="floaty"><g transform="translate(300,208)">
  <ellipse cx="16" cy="172" rx="95" ry="13" fill="#03222a" opacity=".38" filter="url(#soft)"/>
  <use href="#qm" transform="translate(9,10)" stroke="#8a3b06" opacity=".55"/>
  <use href="#qm" stroke="url(#qmO)"/>
  <circle cx="12" cy="112" r="19" fill="#8a3b06" opacity=".45" transform="translate(7,8)"/>
  <circle cx="12" cy="112" r="19" fill="url(#qmO)"/>
  <ellipse cx="5" cy="103" rx="7" ry="4.6" fill="#fff3c4" opacity=".9" transform="rotate(-24 5 103)"/>
  <ellipse cx="-28" cy="-52" rx="16" ry="8" fill="#ffffff" opacity=".4" filter="url(#soft3)" transform="rotate(-32 -28 -52)"/>
</g></g>
<!-- medium question mark, teal -->
<g class="floaty" style="animation-delay:-1.1s;animation-duration:3s"><g transform="translate(512,128) scale(.58)">
  <use href="#qm" transform="translate(9,10)" stroke="#04333d" opacity=".55"/>
  <use href="#qm" stroke="url(#qmT)"/>
  <circle cx="12" cy="112" r="19" fill="url(#qmT)"/>
  <ellipse cx="5" cy="103" rx="7" ry="4.6" fill="#d9fff7" opacity=".9" transform="rotate(-24 5 103)"/>
</g></g>
<!-- small question mark, amber -->
<g class="floaty" style="animation-delay:-2s;animation-duration:2.8s"><g transform="translate(1052,120) scale(.46)">
  <use href="#qm" transform="translate(9,10)" stroke="#8a3b06" opacity=".5"/>
  <use href="#qm" stroke="url(#qmO)"/>
  <circle cx="12" cy="112" r="19" fill="url(#qmO)"/>
</g></g>
<!-- lightbulb -->
<g transform="translate(168,368)">
  <g class="pulse" style="animation-duration:3.8s"><circle cx="0" cy="-46" r="86" fill="url(#glow)"/></g>
  <ellipse cx="2" cy="86" rx="58" ry="9" fill="#03222a" opacity=".38" filter="url(#soft)"/>
  <circle cx="0" cy="-46" r="52" fill="url(#bulb)"/>
  <path d="M-14,-30 C-20,-52 20,-52 14,-30 C10,-16 -10,-16 -14,-30 Z" fill="none" stroke="#d97706" stroke-width="4.5"/>
  <path d="M-13,-14 L13,-14" stroke="#d97706" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="-20" cy="-66" rx="15" ry="9" fill="#ffffff" opacity=".75" filter="url(#soft3)" transform="rotate(-28 -20 -66)"/>
  <g>
    <rect x="-17" y="2" width="34" height="10" rx="3.5" fill="#9fb6bc"/>
    <rect x="-17" y="14" width="34" height="10" rx="3.5" fill="#7d99a1"/>
    <rect x="-17" y="26" width="34" height="10" rx="3.5" fill="#9fb6bc"/>
    <rect x="-11" y="38" width="22" height="12" rx="4" fill="#5f7d86"/>
    <rect x="-17" y="2" width="12" height="34" fill="#ffffff" opacity=".28"/>
  </g>
  <g stroke="#ffd166" stroke-width="5" stroke-linecap="round" opacity=".85">
    <path d="M-72,-78 L-84,-90 M72,-78 L84,-90 M0,-112 L0,-128 M-80,-30 L-96,-34 M80,-30 L96,-34"/>
  </g>
</g>
<!-- trophy -->
<g transform="translate(1318,0)">
  <g class="pulse"><circle cx="0" cy="212" r="168" fill="url(#glow)" opacity=".5"/></g>
  <ellipse cx="0" cy="442" rx="128" ry="14" fill="#03222a" opacity=".42" filter="url(#soft)"/>
  <path d="M-104,158 C-158,158 -178,196 -168,232 C-159,264 -128,282 -96,280" fill="none" stroke="url(#bronze)" stroke-width="21"/>
  <path d="M104,158 C158,158 178,196 168,232 C159,264 128,282 96,280" fill="none" stroke="url(#bronze)" stroke-width="21"/>
  <path d="M-104,148 L104,148 L104,208 C104,272 62,308 0,308 C-62,308 -104,272 -104,208 Z" fill="url(#gold)"/>
  <path d="M0,148 L104,148 L104,208 C104,272 62,308 0,308 Z" fill="#b45309" opacity=".28"/>
  <ellipse cx="0" cy="148" rx="104" ry="17" fill="#ffedb5"/>
  <ellipse cx="0" cy="148" rx="88" ry="12" fill="#f6c453"/>
  <path d="M-88,168 C-60,158 -30,156 0,158" stroke="#fff3c4" stroke-width="7" fill="none" opacity=".7" stroke-linecap="round"/>
  <path d="M0,196 l11.7,24.1 26.6,3.9 -19.3,18.7 4.6,26.3 -23.6,-12.4 -23.6,12.4 4.6,-26.3 -19.3,-18.7 26.6,-3.9 Z" fill="#fff7e6" opacity=".95"/>
  <rect x="-17" y="306" width="34" height="34" fill="url(#bronze)"/>
  <rect x="-58" y="340" width="116" height="17" rx="5" fill="url(#gold)"/>
  <rect x="-72" y="357" width="144" height="24" rx="6" fill="url(#bronze)"/>
  <rect x="-72" y="357" width="144" height="8" rx="4" fill="#ffe9a8" opacity=".8"/>
  <rect x="-84" y="381" width="168" height="26" rx="7" fill="#7c4a03"/>
  <rect x="-84" y="381" width="168" height="8" rx="4" fill="#f6c453" opacity=".55"/>
</g>
<!-- bottom band -->
<path d="M0,470 C300,448 640,482 940,466 C1220,452 1420,478 1600,464 L1600,520 L0,520 Z" fill="#073a44"/>
<path d="M0,470 C300,448 640,482 940,466" fill="none" stroke="#12707f" stroke-width="3" opacity=".6"/>
</svg>
