  <use href="#bal" fill="url(#balO)"/>
  <path d="M0,-118 C26,-116 44,-60 40,6 C38,38 24,60 12,80 L-4,80 C14,44 20,-40 0,-118 Z" fill="#0b5d6b" opacity=".34"/>
