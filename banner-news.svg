  <ellipse cx="-36" cy="-66" rx="17" ry="30" fill="#ffffff" opacity=".38" filter="url(#soft3)" transform="rotate(14 -36 -66)"/>
</g></g></g>
<g class="flyb" style="--f:-1560px;--t:430px;animation-duration:95s;animation-delay:-55s"><g class="bob" style="animation-delay:-1.4s"><g transform="translate(1338,148) scale(.72)">
  <use href="#bal" fill="url(#balT)"/>
  <path d="M0,-118 C26,-116 44,-60 40,6 C38,38 24,60 12,80 L-4,80 C14,44 20,-40 0,-118 Z" fill="#ffd166" opacity=".32"/>
  <ellipse cx="-36" cy="-66" rx="17" ry="30" fill="#ffffff" opacity=".38" filter="url(#soft3)" transform="rotate(14 -36 -66)"/>
</g></g></g>
<g class="flyb" style="--f:-1010px;--t:960px;animation-duration:75s;animation-delay:-38s"><g class="bob" style="animation-delay:-.8s"><g transform="translate(852,96) scale(.42)">
  <use href="#bal" fill="url(#balO)"/>
  <ellipse cx="-36" cy="-66" rx="17" ry="30" fill="#ffffff" opacity=".35" filter="url(#soft3)" transform="rotate(14 -36 -66)"/>
</g></g></g>
