<g transform="translate(0,0)">
  <ellipse cx="1330" cy="470" rx="130" ry="12" fill="#03222a" opacity=".4" filter="url(#soft)"/>
  <path d="M1218,352 L1428,296 L1428,436 L1218,388 Z" fill="url(#mega)"/>
