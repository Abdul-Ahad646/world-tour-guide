<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#052730"/><stop offset=".55" stop-color="#0b5d6b"/><stop offset="1" stop-color="#0e7490"/>
  </linearGradient>
  <radialGradient id="balO" cx=".36" cy=".3" r=".85">
    <stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#fb923c"/><stop offset="1" stop-color="#ea580c"/>
  </radialGradient>
  <radialGradient id="balT" cx=".36" cy=".3" r=".85">
    <stop offset="0" stop-color="#99f6e4"/><stop offset=".45" stop-color="#14b8a6"/><stop offset="1" stop-color="#0b5d6b"/>
  </radialGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3e7c8"/>
  </linearGradient>
  <linearGradient id="mega" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffb347"/><stop offset=".6" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffd166" stop-opacity=".5"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  <g id="bal">
    <path d="M0,-118 C58,-118 96,-76 96,-26 C96,16 58,44 26,74 L14,86 L-14,86 L-26,74 C-58,44 -96,16 -96,-26 C-96,-76 -58,-118 0,-118 Z"/>
    <path d="M-14,86 L-10,112 M14,86 L10,112" stroke="#7c4a03" stroke-width="4"/>
    <path d="M-17,110 L17,110 L13,140 L-13,140 Z" fill="#92600a"/>
    <path d="M-17,110 L17,110 L15,122 L-15,122 Z" fill="#b97e1e"/>
  </g>
</defs>
<style>.cd{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drift{from{transform:translateX(var(--f))}to{transform:translateX(var(--t))}}
.flyb{animation-name:flyb;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes flyb{from{transform:translate(var(--f),26px)}to{transform:translate(var(--t),-34px)}}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
.arc{transform-box:fill-box;transform-origin:center;animation:arcp 1.9s ease-in-out infinite}
@keyframes arcp{0%{transform:scale(.9);opacity:.25}45%{transform:scale(1.05);opacity:.95}100%{transform:scale(1.12);opacity:.2}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1600" height="520" fill="url(#sky)"/>
<circle cx="1300" cy="88" r="95" fill="url(#glow)"/>
<g fill="#ffffff">
  <circle cx="620" cy="52" r="2.6" opacity=".5"/><circle cx="1010" cy="120" r="2.2" opacity=".45"/>
  <circle cx="90" cy="70" r="2.4" opacity=".5"/><circle cx="1560" cy="220" r="2.2" opacity=".4"/>
</g>
<g>
  <g class="cd" style="--f:-820px;--t:1260px;animation-duration:100s;animation-delay:-25s">
  <ellipse cx="576" cy="88" rx="56" ry="15" fill="#04222a" opacity=".16" filter="url(#soft)"/>
  <g fill="#ffffff" opacity=".78">
    <ellipse cx="570" cy="81" rx="50" ry="15"/><ellipse cx="596" cy="74" rx="28" ry="11"/>
  </g>
  </g>
  <g class="cd" style="--f:-1360px;--t:760px;animation-duration:110s;animation-delay:-70s">
  <ellipse cx="1126" cy="196" rx="50" ry="13" fill="#04222a" opacity=".15" filter="url(#soft)"/>
  <g fill="#ffffff" opacity=".7">
    <ellipse cx="1120" cy="190" rx="44" ry="13"/><ellipse cx="1144" cy="183" rx="24" ry="9"/>
  </g>
  </g>
</g>
<!-- hot-air balloons -->
