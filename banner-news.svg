  <ellipse cx="6" cy="74" rx="196" ry="14" fill="#03222a" opacity=".42" filter="url(#soft)"/>
  <g transform="translate(16,18)">
    <rect x="-172" y="-58" width="344" height="114" rx="7" fill="#d9c9a3"/>
  </g>
  <g transform="translate(8,9)">
    <rect x="-172" y="-58" width="344" height="114" rx="7" fill="#e9dcba"/>
  </g>
  <rect x="-172" y="-58" width="344" height="114" rx="7" fill="url(#paper)"/>
  <rect x="-172" y="44" width="344" height="12" rx="6" fill="#c9b78a"/>
  <rect x="-172" y="-58" width="344" height="114" rx="7" fill="none" stroke="#d8c9a8" stroke-width="2"/>
  <rect x="-152" y="-40" width="112" height="80" rx="4" fill="#0e7490"/>
  <rect x="-152" y="-40" width="112" height="80" rx="4" fill="url(#glow)" opacity=".35"/>
