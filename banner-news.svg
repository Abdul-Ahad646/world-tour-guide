    <rect x="30" y="452" width="9" height="12"/><rect x="470" y="466" width="9" height="12"/>
    <rect x="1212" y="432" width="9" height="12"/><rect x="1332" y="466" width="9" height="12"/>
    <rect x="1470" y="440" width="9" height="12"/><rect x="1552" y="452" width="9" height="12"/>
    <rect x="1096" y="470" width="9" height="12"/><rect x="262" y="368" width="8" height="11"/>
    <rect x="1292" y="376" width="8" height="11"/>
  </g>
</g>
<!-- newspaper stack -->
